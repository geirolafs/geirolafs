<g class="in" style="animation-delay:290ms">
<text class="lang" x="1" y="282.2">PRs</text>
<text class="lang m" x="90" y="282.2">git push -f origin master</text>
<text class="lang m" x="332.5" y="282.2" text-anchor="end">0</text>
</g>
<line class="rule" style="animation-delay:340ms" x1="1" x2="332.5" y1="291.7" y2="291.7" stroke="#21262d"/>
<g class="in" style="animation-delay:360ms">
<text class="lang" x="1" y="308.8">Issues</text>
<text class="lang m" x="90" y="308.8">no issues on my end</text>
<text class="lang m" x="332.5" y="308.8" text-anchor="end">Yes</text>
</g>
<line class="rule" style="animation-delay:410ms" x1="1" x2="332.5" y1="318.3" y2="318.3" stroke="#21262d"/>
<g class="in" style="animation-delay:430ms">
<text class="lang" x="1" y="335.4">Contributed</text>
<text class="lang m" x="90" y="335.4">Figma frames</text>
<text class="lang m" x="332.5" y="335.4" text-anchor="end">11,402</text>
</g>
<line class="rule" style="animation-delay:480ms" x1="1" x2="332.5" y1="344.9" y2="344.9" stroke="#21262d"/>
