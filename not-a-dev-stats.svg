<g class="in" style="animation-delay:1640ms">
<circle cx="517.5" cy="304.3" r="4" fill="#e3d6d2"/>
<text class="lang" x="529.5" y="308.8">!important</text>
<text class="lang m" x="845.0" y="308.8" text-anchor="end">11%</text>
