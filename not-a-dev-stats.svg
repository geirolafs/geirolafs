<g class="in" style="animation-delay:1820ms">
<circle cx="517.5" cy="330.9" r="4" fill="#f6bfb3"/>
<g><text class="lang" x="533.0" y="335.4" text-anchor="middle">⌘</text><text class="lang" x="539.9" y="335.4" text-anchor="middle">C</text><text class="lang" x="553.6" y="335.4" text-anchor="middle">&amp;</text><text class="lang" x="567.5" y="335.4" text-anchor="middle">⌘</text><text class="lang" x="574.4" y="335.4" text-anchor="middle">V</text></g>
<text class="lang m" x="845.0" y="335.4" text-anchor="end">8%</text>
</g>
